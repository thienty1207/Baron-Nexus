name: Baron Nexus release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build verified release artifacts
        env:
          BARON_SOURCE_REVISION: ${{ github.sha }}
        run: |
          BARON_VERSION="${GITHUB_REF_NAME#v}" BARON_SOURCE_REVISION="$BARON_SOURCE_REVISION" sh scripts/build-release.sh
      - name: Verify release checksums
        run: |
          cd "dist/${GITHUB_REF_NAME#v}"
          sha256sum -c SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Baron Nexus $GITHUB_REF_NAME" \
            --generate-notes \
            "dist/${GITHUB_REF_NAME#v}"/*
